# licitacoes-pncp-ia — pilha completa (n8n + worker).
# Normalmente é usado pelo instalador (INSTALAR.bat no Windows, instalar.sh no macOS/Linux).
# Uso manual, nesta pasta:  docker compose --env-file .env up -d --build
name: licitacoes-pncp-ia

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: licitacoes-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORTA:-5678}:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

  licitacoes-worker:
    build: ../sistema/worker
    container_name: licitacoes-worker
    restart: unless-stopped
    user: "${WORKER_USUARIO:-1000:1000}"
    environment:
      - LICITACOES_ROOT=/data/LICITACOES
      - TZ=America/Sao_Paulo
      - MCP_PORT=8766
    ports:
      - "127.0.0.1:8765:8765"   # API do worker (o n8n usa http://licitacoes-worker:8765 pela rede interna)
      - "127.0.0.1:8766:8766"   # servidor MCP (http://localhost:8766/mcp)
    volumes:
      - ${LICITACOES_HOST_DIR}:/data/LICITACOES

volumes:
  n8n_data:
